# /etc/nginx/sites-available/juegos.itcanarias.com  (y enlace en sites-enabled)
# Después: sudo nginx -t && sudo systemctl reload nginx
#          sudo certbot --nginx -d juegos.itcanarias.com     (certificado HTTPS)
map $http_upgrade $connection_upgrade { default upgrade; '' close; }
server {
    listen 80;
    server_name juegos.itcanarias.com;
    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
