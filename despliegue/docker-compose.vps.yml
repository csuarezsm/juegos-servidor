# Servidor de juegos en el VPS de IT Canarias (212.227.40.8).
# Se une a la red «proxy-interno», la misma que usa nginx-sat para llegar a las demás apps,
# y solo publica el puerto en 127.0.0.1 (para comprobar /salud desde el propio VPS).
services:
  juegos:
    build: ..
    image: juegos-servidor:latest
    container_name: juegos-servidor
    restart: unless-stopped
    ports:
      - "127.0.0.1:8090:8090"
    environment:
      - PORT=8090
      - NODE_OPTIONS=--max-old-space-size=140
    networks: [proxy-interno]
    mem_limit: 192m
    cpus: 0.5
    pids_limit: 64
    volumes:
      - juegos-datos:/datos          # partidas en curso: sobreviven a reinicios y actualizaciones
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
    logging:
      driver: json-file
      options: { max-size: "5m", max-file: "3" }
networks:
  proxy-interno:
    external: true
volumes:
  juegos-datos:
